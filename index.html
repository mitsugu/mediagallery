<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Gallery (Image & Video & Audio)</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --accent-color: #007bff;
        }

        body { font-family: sans-serif; background: var(--bg-color); padding: 20px; }
        h1 { font-size:2.5rem; text-align:center; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .thumb-wrapper {
            width: 100%;
            height: 180px;
            cursor: pointer;
            background: #000;
            position: relative;
        }

        .thumb-wrapper img, .thumb-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-indicator::after {
            content: "▶";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.8);
            font-size: 30px;
            pointer-events: none;
        }

        .item-info { padding: 10px; display: flex; justify-content: center; }
        .copy-btn {
            background: var(--accent-color); color: white; border: none;
            padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
        }

        .lightbox {
            display: none; position: fixed; z-index: 1000;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); flex-direction: column;
            justify-content: center; align-items: center;
        }
        .lightbox.active { display: flex; }
        .lightbox-content {
            width: 90vw;
            height: 80vh;
            object-fit: contain;
            outline: none;
        }
        video.lightbox-content {
            background-color: #000;
        }
        .close-btn { position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; cursor: pointer; }

			.toast {
				position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
				background: #333; color: white; padding: 10px 20px; border-radius: 20px;
				opacity: 0; transition: opacity 0.3s; pointer-events: none;
			}
		</style>
	</head>
	<body>

</body>
</html>
